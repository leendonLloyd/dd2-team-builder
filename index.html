<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Darkest Dungeon II — Hero Reference & Team Builder</title>
<style>
  :root {
    --bg:#14110f; --bg-panel:#1e1a17; --bg-panel-2:#262019; --bg-hover:#2f2820;
    --border:#3a322a; --text:#ece3d6; --text-dim:#a89a86; --text-faint:#7a6f60;
    --accent:#c9a24b; --accent-2:#b5462f; --shadow:0 8px 24px rgba(0,0,0,.45);
    --radius:10px; --good:#5fb56a; --bad:#c0503a;
    --t-damage:#d6603f; --t-dot:#9c6ad1; --t-heal:#5fb56a; --t-buff:#4f92d6;
    --t-debuff:#d69a3f; --t-support:#43b3a5; --t-control:#7d7ad6;
    --rank-hero:#c9a24b; --rank-enemy:#d6603f; --rank-ally:#5fb56a; --rank-off:#3a322a; --tgt:#5b9bd6;
  }
  :root[data-theme="light"] {
    --bg:#f2ece1; --bg-panel:#fbf7ef; --bg-panel-2:#f0e8da; --bg-hover:#e8dfcd;
    --border:#d8ccb6; --text:#2a231a; --text-dim:#6b5f4c; --text-faint:#94886f;
    --accent:#9a7420; --accent-2:#a83b25; --shadow:0 6px 18px rgba(120,100,60,.18);
    --good:#3f8f4a; --bad:#b53d27;
    --t-damage:#c14e2e; --t-dot:#7d4bb5; --t-heal:#3f8f4a; --t-buff:#316fb3;
    --t-debuff:#b07a1f; --t-support:#2c8f83; --t-control:#5b58b5;
    --rank-hero:#9a7420; --rank-enemy:#c14e2e; --rank-ally:#3f8f4a; --rank-off:#c9bca0; --tgt:#2f6fb3;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,-apple-system,sans-serif; line-height:1.5; font-size:15px; }
  a { color:var(--accent); }
  img { max-width:100%; }

  header.top { padding:11px 18px; border-bottom:1px solid var(--border); background:linear-gradient(180deg,var(--bg-panel-2),var(--bg-panel)); }
  .title-row { display:flex; align-items:center; gap:12px; }
  header.top h1 { margin:0; font-size:1.2rem; letter-spacing:.5px; color:var(--accent); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @media (max-width:560px){ header.top h1 { font-size:1.05rem; } }
  header.top .sub { color:var(--text-dim); font-size:.8rem; margin-top:5px; max-width:920px; }
  .hdr-actions { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .hdr-team { display:flex; gap:8px; align-items:center; }
  .hdr-btn { cursor:pointer; background:var(--bg-panel); border:1px solid var(--border); color:var(--text); border-radius:20px; padding:6px 12px; font-size:.76rem; font-weight:600; white-space:nowrap; }
  .hdr-btn:hover { background:var(--bg-hover); }
  .hdr-btn.warn:hover { border-color:var(--bad); color:var(--bad); }
  .hdr-btn.on { background:var(--accent); border-color:var(--accent); color:#1a1510; }
  .theme-toggle { cursor:pointer; background:var(--bg-panel); border:1px solid var(--border); color:var(--text); border-radius:20px; padding:6px 12px; font-size:.76rem; white-space:nowrap; }
  .theme-toggle:hover { background:var(--bg-hover); }

  .tabs { display:flex; gap:4px; padding:0 24px; border-bottom:1px solid var(--border); background:var(--bg-panel); }
  .tab { cursor:pointer; padding:12px 20px; font-weight:600; color:var(--text-dim); border-bottom:3px solid transparent; margin-bottom:-1px; }
  .tab:hover { color:var(--text); }
  .tab.active { color:var(--accent); border-bottom-color:var(--accent); }

  .controls { padding:14px 24px; display:flex; gap:14px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--border); background:var(--bg-panel); }
  #search { flex:1; min-width:220px; padding:9px 14px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:.95rem; }
  #search:focus { outline:none; border-color:var(--accent); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .filter-panel { flex-basis:100%; width:100%; display:none; flex-direction:column; gap:10px; margin-top:2px; }
  .filter-panel.open { display:flex; }
  .chip { cursor:pointer; padding:6px 12px; border-radius:16px; font-size:.78rem; border:1px solid var(--border); background:var(--bg); color:var(--text-dim); white-space:nowrap; user-select:none; }
  .chip:hover { background:var(--bg-hover); color:var(--text); }
  .chip.active { background:var(--accent); border-color:var(--accent); color:#1a1510; font-weight:600; }

  .layout { display:grid; grid-template-columns:300px 1fr; align-items:start; min-height:calc(100vh - 190px); }
  .sidebar { position:sticky; top:0; align-self:start; max-height:100vh; border-right:1px solid var(--border); overflow-y:auto; background:var(--bg-panel); }
  @media (max-width:820px){
    .layout{ grid-template-columns:60px 1fr; }                 /* keep it a left sidebar (icon rail) on mobile */
    .sidebar .hero-item{ padding:8px 0; justify-content:center; }
    .sidebar .hero-item .txt{ display:none; }
    .sidebar .hero-item.active{ border-left:3px solid var(--accent); }
    .sidebar .avatar{ width:42px; height:42px; }
  }
  .hero-item { padding:9px 16px; cursor:pointer; border-bottom:1px solid var(--border); display:flex; gap:11px; align-items:center; }
  .hero-item:hover { background:var(--bg-hover); }
  .hero-item.active { background:var(--bg-panel-2); border-left:3px solid var(--accent); padding-left:13px; }
  .hero-item .txt { display:flex; flex-direction:column; gap:1px; min-width:0; }
  .hero-item .hn { font-weight:600; font-size:.95rem; }
  .hero-item .hd { font-size:.7rem; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dlc-tag { font-size:.6rem; text-transform:uppercase; letter-spacing:.5px; color:var(--accent-2); font-weight:700; }

  .avatar { width:44px; height:44px; border-radius:8px; object-fit:cover; object-position:center top; background:var(--bg-panel-2); border:1px solid var(--border); flex-shrink:0; }
  .avatar.lg { width:96px; height:96px; border-radius:12px; }
  .avatar.md { width:52px; height:52px; border-radius:10px; }
  .avatar.fallback { display:inline-flex; align-items:center; justify-content:center; font-weight:700; color:var(--accent); font-size:1rem; }

  .detail { padding:24px 32px; overflow-y:auto; }
  @media (max-width:560px){ .detail{ padding:18px 14px; } .controls{ padding:12px 14px; } header.top{ padding:14px; } .tabs{ padding:0 10px; } }
  .detail h2 { margin:0 0 3px; font-size:1.7rem; color:var(--accent); }
  .detail-head { display:flex; gap:18px; align-items:flex-start; margin-bottom:14px; }
  .role { color:var(--text-dim); font-style:italic; margin:0 0 10px; max-width:720px; }
  .badges { display:flex; gap:8px; flex-wrap:wrap; }
  .badge { font-size:.72rem; padding:4px 10px; border-radius:6px; background:var(--bg-panel-2); border:1px solid var(--border); color:var(--text-dim); }
  .badge.dlc { color:var(--accent-2); font-weight:700; }

  .section-title { font-size:.8rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--text-faint); margin:24px 0 12px; padding-bottom:6px; border-bottom:1px solid var(--border); font-weight:700; }
  .statgrid { display:flex; gap:20px; flex-wrap:wrap; margin-bottom:6px; }
  .statbox { background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); padding:9px 15px; min-width:84px; }
  .statbox .lbl { font-size:.66rem; text-transform:uppercase; letter-spacing:.8px; color:var(--text-faint); }
  .statbox .val { font-size:1.2rem; font-weight:700; }
  .res-grid { display:flex; gap:7px; flex-wrap:wrap; }
  .res { background:var(--bg-panel); border:1px solid var(--border); border-radius:7px; padding:6px 10px; font-size:.78rem; }
  .res .rl { color:var(--text-faint); font-size:.64rem; text-transform:uppercase; letter-spacing:.5px; }
  .res .rv { font-weight:600; }
  .mechanic { background:var(--bg-panel-2); border-left:3px solid var(--accent); border-radius:6px; padding:11px 15px; font-size:.86rem; color:var(--text-dim); }

  .path-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .path-tab { cursor:pointer; padding:7px 14px; border-radius:8px; font-size:.84rem; font-weight:600; border:1px solid var(--border); background:var(--bg-panel); color:var(--text-dim); }
  .path-tab:hover { background:var(--bg-hover); color:var(--text); }
  .path-tab.active { background:var(--accent); border-color:var(--accent); color:#1a1510; }
  .path-tab.default-path { border-style:dashed; }
  .path-desc { background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; font-size:.86rem; color:var(--text-dim); margin-bottom:8px; }
  .path-desc b { color:var(--text); }

  table.skills { width:100%; border-collapse:collapse; font-size:.84rem; }
  table.skills th { text-align:left; padding:8px 10px; color:var(--text-faint); font-size:.66rem; text-transform:uppercase; letter-spacing:.8px; border-bottom:2px solid var(--border); }
  table.skills td { padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  table.skills tr.mod-hit td { background:color-mix(in srgb, var(--accent) 10%, transparent); }
  table.skills tr.dim { opacity:.38; }
  .skill-name-cell { display:flex; align-items:center; gap:9px; }
  .skill-ic { width:34px; height:34px; border-radius:7px; background:var(--bg-panel-2); border:1px solid var(--border); object-fit:cover; flex-shrink:0; }
  .glyph { width:34px; height:34px; border-radius:7px; display:inline-flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-size:1rem; flex-shrink:0; }
  /* skill icon + type label stacked; label never exceeds icon width */
  .skic { display:flex; flex-direction:column; align-items:center; gap:3px; width:34px; flex:0 0 auto; }
  .tlabel { width:100%; box-sizing:border-box; font-size:.5rem; font-weight:800; text-transform:uppercase; letter-spacing:.2px; color:#fff; border-radius:4px; padding:1px 2px; text-align:center; line-height:1.05; word-break:break-word; }
  /* targeting descriptor chips (lasso / corpse / …) */
  .rankchip { display:inline-block; font-size:.58rem; font-weight:700; text-transform:capitalize; color:var(--text-dim); background:var(--bg-panel-2); border:1px solid var(--border); border-radius:5px; padding:1px 6px; margin-left:4px; cursor:help; white-space:nowrap; }
  .skic-chips { display:flex; flex-direction:column; align-items:center; gap:3px; margin-top:8px; width:100%; }   /* gap from the type label */
  .skic-chips .rankchip { width:100%; margin-left:0; box-sizing:border-box; text-align:center; font-size:.55rem; padding:1px 3px; overflow:hidden; }
  #tip { position:fixed; z-index:80; display:none; max-width:220px; background:var(--bg-panel); border:1px solid var(--accent); border-radius:8px; padding:8px 11px; font-size:.76rem; color:var(--text); box-shadow:var(--shadow); }
  .skill-name { font-weight:600; }
  .type-badge { display:inline-block; font-size:.66rem; font-weight:700; padding:3px 8px; border-radius:5px; text-transform:uppercase; letter-spacing:.4px; color:#fff; white-space:nowrap; }
  .t-Damage,.g-Damage{ background:var(--t-damage);} .t-DoT,.g-DoT{ background:var(--t-dot);}
  .t-Heal,.g-Heal{ background:var(--t-heal);} .t-Buff,.g-Buff{ background:var(--t-buff);}
  .t-Debuff,.g-Debuff{ background:var(--t-debuff);} .t-Support,.g-Support{ background:var(--t-support);}
  .t-Control,.g-Control{ background:var(--t-control);}

  /* wiki-style 4-circle rank/target indicators: yellow = usable position, blue = target */
  .circs { display:inline-flex; gap:3px; vertical-align:middle; }
  .circ { width:13px; height:13px; border-radius:50%; box-sizing:border-box; border:2px solid var(--text-dim); background:transparent; }
  .circ.pos.on { background:var(--accent); border-color:var(--accent); }
  .circ.tgt.on { background:var(--tgt); border-color:var(--tgt); }
  .rank-text { font-size:.72rem; color:var(--text-dim); background:var(--bg-panel-2); padding:2px 7px; border-radius:5px; border:1px solid var(--border); vertical-align:middle; }
  .path-cell { color:var(--text-dim); font-size:.8rem; }
  .path-cell.none { color:var(--text-faint); }

  .trinket { background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); padding:11px 15px; margin-bottom:9px; }
  .trinket .tn { font-weight:700; color:var(--accent); margin-bottom:3px; }
  .trinket .te { font-size:.85rem; color:var(--text-dim); }

  .legend,.tips { background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px 18px; margin:8px 0; font-size:.84rem; color:var(--text-dim); }
  .legend b,.tips b { color:var(--text); }
  .tips ul { margin:6px 0 0; padding-left:20px; } .tips li { margin-bottom:6px; }
  details.foot { margin:18px 24px; } details.foot summary { cursor:pointer; color:var(--accent); font-weight:600; padding:8px 0; }
  .rank-legend { display:flex; gap:16px; flex-wrap:wrap; font-size:.76rem; color:var(--text-faint); margin-top:8px; }
  .rank-legend span { display:inline-flex; align-items:center; gap:5px; }
  .swatch { width:13px; height:13px; border-radius:3px; display:inline-block; }
  .hl { background:var(--accent); color:#1a1510; border-radius:3px; padding:0 2px; }
  .count { color:var(--text-faint); font-size:.74rem; padding:6px 18px; }
  .error { margin:40px auto; max-width:640px; background:var(--bg-panel); border:1px solid var(--accent-2); border-radius:var(--radius); padding:24px; }
  .error h3 { color:var(--accent-2); margin-top:0; }
  .error code { background:var(--bg); padding:2px 7px; border-radius:4px; color:var(--accent); }

  /* ---------- Team Builder (mobile-first) ---------- */
  .btn { cursor:pointer; border:1px solid var(--border); background:var(--bg-panel); color:var(--text); border-radius:8px; padding:8px 14px; font-size:.82rem; font-weight:600; }
  .btn:hover { background:var(--bg-hover); }
  .btn.warn:hover { border-color:var(--bad); color:var(--bad); }
  .loadout-count { font-size:.72rem; color:var(--text-faint); }
  .loadout-count.full { color:var(--accent); }

  .tb-layout { display:grid; grid-template-columns:64px 1fr; align-items:start; position:relative; }
  .tb-layout.rail-collapsed { grid-template-columns:0 1fr; }         /* main takes the list's space */
  .tb-layout.rail-collapsed .tb-rail { display:none; }
  /* left icon rail */
  .tb-rail { grid-column:1; position:sticky; top:0; align-self:start; max-height:100vh; overflow:hidden auto; background:var(--bg-panel); border-right:1px solid var(--border); padding:8px 0; display:flex; flex-direction:column; align-items:center; gap:9px; }
  /* collapse/expand handle sitting on the side of the list */
  .rail-toggle { position:fixed; top:50%; transform:translateY(-50%); left:64px; z-index:30; width:19px; height:56px; border:1px solid var(--border); border-left:none; background:var(--bg-panel); color:var(--text-dim); border-radius:0 8px 8px 0; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:.78rem; box-shadow:2px 0 8px rgba(0,0,0,.18); transition:left .18s ease; }
  .rail-toggle:hover { background:var(--bg-hover); color:var(--text); }
  .tb-layout.rail-collapsed .rail-toggle { left:0; }
  .rail-icon { position:relative; cursor:pointer; line-height:0; }
  .rail-icon .avatar.rail { width:46px; height:46px; border-radius:9px; }
  .rail-icon.in-team .avatar.rail { outline:2px solid var(--accent); outline-offset:1px; }
  .rail-icon.full-dis { opacity:.32; cursor:not-allowed; }
  .rail-badge { position:absolute; top:-5px; right:-5px; background:var(--accent); color:#1a1510; font-size:.62rem; font-weight:800; border-radius:50%; width:17px; height:17px; display:flex; align-items:center; justify-content:center; }

  .tb-main { grid-column:2; padding:14px 16px; min-width:0; }
  .tb-actions { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }

  /* formation strip: 4 compact rank slots, right-to-left */
  .tb-formation { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-bottom:16px; }
  .fslot { background:var(--bg-panel); border:1px solid var(--border); border-radius:10px; padding:8px 4px; text-align:center; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; min-height:96px; justify-content:center; }
  .fslot.sel { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 15%,transparent); }
  .fslot.empty { border-style:dashed; color:var(--text-faint); cursor:default; }
  .fslot .frank { font-size:.6rem; text-transform:uppercase; letter-spacing:.4px; color:var(--text-faint); font-weight:700; }
  .fslot.sel .frank { color:var(--accent); }
  .fslot .avatar.fav { width:42px; height:42px; border-radius:8px; pointer-events:none; }
  .fslot .fname { font-size:.66rem; font-weight:600; line-height:1.15; }
  .fslot .fpath { font-size:.58rem; color:var(--text-faint); line-height:1.1; }
  .fslot:not(.empty) { cursor:grab; touch-action:none; }
  .fslot.dragging { opacity:.45; cursor:grabbing; }
  .fslot.drop-target { outline:2px dashed var(--accent); outline-offset:2px; }

  /* per-hero blocks stacked: header row + horizontal strip of detailed skill cards */
  .tb-detail { display:flex; flex-direction:column; gap:9px; }
  .tb-hero-block { border:1px solid var(--border); border-radius:11px; padding:9px 10px; background:var(--bg-panel); }
  .tbd-head { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .tbd-id { display:flex; gap:9px; align-items:center; min-width:0; flex:1; cursor:pointer; border-radius:9px; padding:2px; }
  .tbd-id:hover { background:color-mix(in srgb, var(--bad) 14%, transparent); }
  .tbd-id:hover .tbd-name { color:var(--bad); }
  .tbd-id:hover::after { content:"✕ remove"; font-size:.6rem; font-weight:700; color:var(--bad); white-space:nowrap; }
  .tbd-meta { flex:1; min-width:0; }
  .tb-empty { color:var(--text-faint); font-size:.85rem; padding:20px 4px; text-align:center; }
  .tbd-skills { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scroll-snap-type:x proximity; }
  .tbd-skills .sk { flex:0 0 clamp(210px,76vw,244px); box-sizing:border-box; border:1px solid var(--border); border-radius:10px; align-items:flex-start; gap:10px; padding:10px; scroll-snap-align:start; }
  .tbd-skills .sk .skill-ic, .tbd-skills .sk .glyph { width:50px; height:50px; border-radius:10px; }   /* bigger skill icon */
  .tbd-skills .skic { width:50px; }
  .tbd-skills .sk .skbody { display:flex; flex-direction:column; gap:5px; }
  .tbd-skills .sk .sknm { font-size:.8rem; }                       /* smaller name */
  .tbd-skills .sk .skmeta { margin:0; gap:14px; }
  .tbd-skills .sk .circ { width:10px; height:10px; }               /* smaller rank/target circles */
  .tbd-skills .sk .skeff { font-size:.72rem; line-height:1.34; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .tbd-skills .sk .skpath { font-size:.68rem; }
  .tbd-skills .sk .use-badge { display:none; }   /* equipped = already chosen; usability implied by dimming + circles */
  .skc-edit { flex:0 0 82px; border:1px dashed var(--border); border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--accent); cursor:pointer; font-size:.72rem; scroll-snap-align:start; }
  .skc-edit:hover { background:var(--bg-hover); }
  .skc-count { font-size:.66rem; font-weight:700; color:var(--text-faint); }
  .skc-count.full { color:var(--accent); }
  .avatar.md { width:44px; height:44px; border-radius:9px; }
  .tbd-name { font-weight:700; font-size:.95rem; color:var(--accent); line-height:1.12; }
  .tbd-sub { display:flex; align-items:center; gap:8px; margin-top:3px; }
  .upg-toggle { cursor:pointer; border:1px solid var(--border); background:var(--bg); color:var(--text-dim); border-radius:13px; padding:2px 9px; font-size:.66rem; font-weight:700; white-space:nowrap; }
  .upg-toggle:hover { background:var(--bg-hover); color:var(--text); }
  .upg-toggle.on { background:var(--accent); border-color:var(--accent); color:#1a1510; }
  .tbd-path { flex:0 0 122px; width:122px; padding:5px 7px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:.78rem; }
  .mini { cursor:pointer; border:1px solid var(--border); background:var(--bg); color:var(--text-dim); border-radius:6px; padding:5px 9px; font-size:.78rem; }
  .mini:hover:not(:disabled) { background:var(--bg-hover); color:var(--text); }
  .mini:disabled { opacity:.4; cursor:not-allowed; }
  .mini.chev { width:30px; padding:5px 0; text-align:center; font-size:.9rem; line-height:1; }

  .sk { display:flex; gap:10px; padding:11px 6px; border-bottom:1px solid var(--border); cursor:pointer; position:relative; }
  .sk:hover { background:var(--bg-hover); }
  .sk.unusable { opacity:.42; }
  .sk.equipped { background:color-mix(in srgb, var(--accent) 14%, transparent); }
  .sk.equipped::before { content:"★"; position:absolute; right:6px; top:9px; color:var(--accent); font-size:.85rem; }
  .sk .skbody { min-width:0; flex:1; }
  .sk .skrow1 { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .sk .sknm { font-weight:600; font-size:.9rem; }
  .sk .use-badge { font-size:.6rem; font-weight:700; padding:2px 6px; border-radius:4px; text-transform:uppercase; letter-spacing:.4px; }
  .sk .use-badge.ok { background:var(--good); color:#0f2311; }
  .sk .use-badge.no { background:transparent; color:var(--bad); border:1px solid var(--bad); }
  .sk .skmeta { font-size:.72rem; color:var(--text-faint); margin:4px 0; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .sk .skeff { font-size:.8rem; color:var(--text-dim); }
  .sk .skpath { font-size:.75rem; color:var(--accent); margin-top:4px; }
  .tok { width:15px; height:15px; vertical-align:-3px; display:inline-block; margin:0 1px; }
  .efline { margin:1px 0; }
  .eff-cell { white-space:pre-line; }
  .up-tag { font-size:.7rem; color:var(--text-faint); cursor:default; }
  .up-tag.on { color:var(--accent); }
  .skeff.is-up { border-left:2px solid var(--accent); padding-left:7px; }
  /* compendium skills as full-width card rows (roomy effect column) */
  .comp-skills { display:flex; flex-direction:column; }
  .comp-skills .sk { align-items:flex-start; gap:12px; padding:13px 2px; border-bottom:1px solid var(--border); border-radius:0; cursor:default; }
  .comp-skills .sk:hover { background:transparent; }
  .comp-skills .up-tag { display:none; }
  .comp-skills .skic { width:50px; }
  .comp-skills .skill-ic, .comp-skills .glyph { width:50px; height:50px; border-radius:10px; }
  .comp-skills .sknm { font-size:.95rem; }
  .comp-skills .skeff { font-size:.82rem; }
  .comp-skills .skeff + .skeff { margin-top:8px; }
  .sub-lbl { display:block; font-size:.6rem; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--text-faint); margin-bottom:2px; }
  .skeff.is-up .sub-lbl { color:var(--accent); }
  .skpaths { font-size:.78rem; color:var(--text-dim); line-height:1.5; margin-top:9px; border-top:1px dashed var(--border); padding-top:8px; }
  .sk.static { cursor:pointer; }
  .sk.static::before { content:none; }   /* no star clutter in main view — everything there is equipped */

  .tbd-skillbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:2px 0 8px; }

  /* skill picker modal (bottom-sheet on phones, centered on desktop) */
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.66); display:none; align-items:flex-end; justify-content:center; z-index:60; }
  .modal-bg.open { display:flex; }
  .modal { background:var(--bg-panel); border:1px solid var(--border); border-radius:16px 16px 0 0; width:100%; max-width:640px; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow); }
  @media (min-width:600px){ .modal-bg { align-items:center; padding:20px; } .modal { border-radius:16px; } }
  .modal-hd { position:sticky; top:0; background:var(--bg-panel); border-bottom:1px solid var(--border); padding:13px 16px; display:flex; align-items:flex-start; gap:10px; z-index:2; }
  .mh-title { flex:1; min-width:0; }
  .mh-controls { display:flex; gap:8px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--border); }
  .mh-path { flex:1; min-width:0; padding:6px 8px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:.85rem; }
  .modal-hd .mt { font-weight:700; color:var(--accent); font-size:1rem; }
  .modal-hd .mc { margin-top:2px; }
  .modal-close { margin-left:auto; cursor:pointer; color:var(--text-dim); font-size:1.25rem; line-height:1; padding:2px 8px; border-radius:6px; }
  .modal-close:hover { background:var(--bg-hover); color:var(--text); }
  .modal-body { padding:2px 12px 16px; }
  .modal-body .sk.cap { opacity:.4; }
</style>
</head>
<body>
<header class="top">
  <div class="title-row">
    <h1>⚔ Darkest Dungeon II</h1>
    <div class="hdr-actions">
      <span id="hdrTeam" class="hdr-team">
        <select class="hdr-btn" id="tbSample" title="Load a sample team">
          <option value="" selected>✨ Sample ▾</option>
          <option value="grandslam">Grand Slam · MAA/Cru/HWM/PD</option>
          <option value="leperGR">Leper · Leper/GR/Jester/PD (stress-safe)</option>
          <option value="leperSharp">Leper · Leper/Cru/HWM/PD (sniper)</option>
          <option value="dot">DoT · Flag/Cru/Run/PD</option>
        </select>
        <button class="hdr-btn warn" id="tbClear" title="Clear team">Clear</button>
      </span>
      <button class="theme-toggle" id="themeToggle">☾ Theme</button>
    </div>
  </div>
</header>

<div class="tabs">
  <div class="tab" data-view="compendium">📖 Compendium</div>
  <div class="tab active" data-view="builder">🛡 Team Builder</div>
</div>

<!-- COMPENDIUM -->
<div id="view-compendium" style="display:none">
  <div class="controls">
    <input id="search" type="text" placeholder="Search heroes, skills, trinkets…" autocomplete="off">
    <button class="hdr-btn" id="filterToggle">☰ Filters</button>
    <div class="filter-panel" id="filterPanel">
      <div class="chips" id="dlcFilters"></div>
      <div class="chips" id="tagFilters"></div>
    </div>
  </div>
  <div class="count" id="count"></div>
  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="detail" id="detail"></div>
  </div>
  <details class="foot" id="legendWrap"><summary>Token legend & how to read this</summary><div class="legend" id="legend"></div></details>
  <details class="foot" open><summary>Confession run tips</summary><div class="tips" id="tips"></div></details>
</div>

<!-- TEAM BUILDER -->
<div id="view-builder">
  <div class="tb-layout">
    <button class="rail-toggle" id="railToggle" aria-label="toggle hero list" title="Hide hero list">◂</button>
    <aside class="tb-rail" id="tbRail" title="Tap a hero to add / remove"></aside>
    <div class="tb-main">
      <div class="tb-formation" id="tbFormation"></div>
      <div class="tb-detail" id="tbDetail"></div>
    </div>
  </div>
</div>

<!-- skill picker modal -->
<div class="modal-bg" id="skillModalBg">
  <div class="modal" id="skillModal"></div>
</div>
<div id="tip"></div>

<script>
const state = { data:null, search:"", dlc:"All", tag:"All", hero:null, path:null, view:"builder", tbSelected:null, skillModal:null, railCollapsed:false, showUpgraded:false };
const $ = id => document.getElementById(id);
const TYPES = ["Damage","DoT","Heal","Buff","Debuff","Support","Control"];

/* theme */
$("themeToggle").onclick = () => { const r=document.documentElement; r.setAttribute("data-theme", r.getAttribute("data-theme")==="dark"?"light":"dark"); };
// dark is the default (data-theme="dark" on <html>); OS preference no longer auto-overrides it.

/* tabs */
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===t));
  state.view = t.dataset.view;
  $("view-compendium").style.display = state.view==="compendium"?"":"none";
  $("view-builder").style.display = state.view==="builder"?"":"none";
  $("hdrTeam").style.display = state.view==="builder"?"flex":"none";
  if (state.view==="builder") renderBuilder();
});

/* tap/click a descriptor chip -> show its tooltip (mobile-friendly); tap elsewhere hides it */
document.addEventListener("click", e=>{
  const chip=e.target.closest(".rankchip");
  const tip=$("tip");
  if(chip){
    e.stopPropagation();                     // don't open the skill modal
    const r=chip.getBoundingClientRect();
    tip.textContent=chip.dataset.tip||chip.title||"";
    tip.style.display="block";
    tip.style.left=Math.max(6, Math.min(r.left, window.innerWidth-226))+"px";
    tip.style.top=(r.bottom+6)+"px";
  } else { tip.style.display="none"; }
}, true);

/* ---------- load ---------- */
async function load() {
  try {
    const res = await fetch("heroes.json",{cache:"no-store"});
    if (!res.ok) throw new Error("HTTP "+res.status);
    state.data = await res.json();
    init();
  } catch(e) {
    document.body.innerHTML = `<div class="error"><h3>Couldn't load heroes.json</h3>
      <p>Your browser blocked reading the data file from disk (a <code>file://</code> security restriction). Serve the folder over HTTP and reopen:</p>
      <p><code>python -m http.server 8000</code> &nbsp;→&nbsp; <code>http://localhost:8000/</code></p>
      <p style="color:var(--text-faint);font-size:.85rem">${String(e)}</p></div>`;
  }
}

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* swap status/DoT/token words for inline icons to save space */
const TOK_RE=/(?<![A-Za-z])(Unchecked Power|Regeneration|Block\+|Dodge\+|Guarded|Bleed|Blight|Burn|Combo|Strength|Crit|Blind|Daze|Stun|Taunt|Riposte|Speed|Stealth|Vulnerable|Weak|Guard|Immobilize|Horror|Winded|Stress|Regen|Block|Dodge)(?![A-Za-z])/gi;
function tokKey(w){ const s=w.toLowerCase();
  if(s==="unchecked power") return "uncheckedpower";
  if(s==="block+") return "blockplus"; if(s==="dodge+") return "dodgeplus";
  if(s==="regeneration"||s==="regen") return "regen";
  if(s==="guard"||s==="guarded") return "guarded";
  return s; }
function tokenizeEffect(text){
  return esc(String(text||"")).replace(TOK_RE, m=>`<img class="tok" src="icons/tokens/${tokKey(m)}.png" alt="${esc(m)}" title="${esc(m)}">`);
}
/* render each unrelated effect (newline-separated) on its own line */
function effectHtml(text){
  return String(text||"").split("\n").map(l=>l.trim()).filter(Boolean)
    .map(l=>`<div class="efline">${tokenizeEffect(l)}</div>`).join("");
}
function heroBy(n){ return state.data.heroes.find(h=>h.name===n); }
function defaultPath(h){ const d=h.paths.find(p=>p.default); return d?d.name:h.paths[0].name; }
function updateFilterBtn(){
  const n=(state.dlc!=="All"?1:0)+(state.tag!=="All"?1:0);
  const btn=$("filterToggle"); if(!btn) return;
  btn.classList.toggle("on", n>0);
  btn.textContent = n>0 ? `☰ Filters (${n})` : "☰ Filters";
}
function typeKey(t){ return (t||"").split("/")[0]; }
const TYPE_SHORT={Damage:"DMG",DoT:"DOT",Heal:"HEAL",Buff:"BUFF",Debuff:"DEB",Support:"SUP",Control:"CTRL"};
function typeShort(t){ const k=typeKey(t); return TYPE_SHORT[k]||k.toUpperCase(); }
function parseRanks(str){
  const s=String(str||""); const pos=new Set(); const re=/([1-4])\s*-\s*([1-4])/g; let m;
  while((m=re.exec(s))){ let a=+m[1],b=+m[2]; if(a>b)[a,b]=[b,a]; for(let i=a;i<=b;i++)pos.add(i); }
  const rest=s.replace(re,"  "); const sr=/[1-4]/g;
  while((m=sr.exec(rest))) pos.add(+m[0]);
  return pos;
}
// path-aware effective ranks/target (some paths change where a skill is usable / what it hits)
function effRanks(s,path){ return (path && s.pathRanks && s.pathRanks[path] && s.pathRanks[path].ranks) || s.ranks; }
function effTarget(s,path){ return (path && s.pathRanks && s.pathRanks[path] && s.pathRanks[path].target) || s.target; }
function usableAt(skill, rank, path){ const p=parseRanks(effRanks(skill,path)); return p.size===0 || p.has(rank); } // no digits = any rank / passive
function highlight(text,term){ const t=esc(text); if(!term) return t; const re=new RegExp("("+term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"); return t.replace(re,'<span class="hl">$1</span>'); }
function heroMatches(h,term){ if(!term) return true; const hay=[h.name,h.role,(h.tags||[]).join(" "),h.skills.map(s=>s.name+" "+s.effect).join(" "),h.trinkets.map(t=>t.name).join(" "),h.paths.map(p=>p.name).join(" ")].join(" ").toLowerCase(); return hay.includes(term.toLowerCase()); }

function portraitHtml(h, cls){
  const initials = h.name.split(/[\s-]/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const fb = `<span class="avatar ${cls||''} fallback">${initials}</span>`;
  if (h.portrait) return `<img class="avatar ${cls||''}" src="${esc(h.portrait)}" alt="${esc(h.name)}" loading="lazy" onerror="this.outerHTML=this.getAttribute('data-fb')" data-fb="${esc(fb)}">`;
  return fb;
}
function skillIconHtml(s){
  const k=typeKey(s.type); const initial=(s.name.replace(/\(.*?\)/,'').trim()[0]||'?').toUpperCase();
  const glyph=`<span class="glyph g-${k}">${initial}</span>`;
  if (s.icon) return `<img class="skill-ic" src="${esc(s.icon)}" alt="" loading="lazy" onerror="this.outerHTML=this.getAttribute('data-fb')" data-fb="${esc(glyph)}">`;
  return glyph;
}
const DESC=[
  ["lasso","lasso","Lasso — hits adjacent enemies as one group (a positionable AoE)."],
  ["corpse","corpse","Can also target a corpse to clear it (removes the dead body blocking that rank)."],
  ["aoe","AoE","Area of effect — hits several enemies at once."],
  ["sides","sides","Hits the side ranks (the outer targets)."],
  ["adjacent","adjacent","Hits adjacent targets together."],
];
// all target descriptors for a skill (nature labels + keyword chips) — shown as chips under the icon
function descTagsFor(s, path){
  const src=((effRanks(s,path)||"")+" "+(effTarget(s,path)||"")).toLowerCase();
  const out=[]; const seen=new Set();
  const push=(lab,tip)=>{ const k=lab.toLowerCase(); if(seen.has(k))return; seen.add(k); out.push(`<span class="rankchip" data-tip="${esc(tip)}" title="${esc(tip)}">${esc(lab)}</span>`); };
  for(const [k,lab,tip] of DESC){ if(src.includes(k)) push(lab,tip); }
  const NATURE=[
    [/\bself\b/,"Self","Targets the caster (self)."],
    [/\ballies\b/,"Allies","Targets allies."],
    [/\bally\b/,"Allies","Targets an ally."],
    [/\battacker\b/,"Attacker","Targets whoever struck it (a counter / Riposte)."],
  ];
  for(const [re,lab,tip] of NATURE){ if(re.test(src)) push(lab,tip); }
  return out.join("");
}
function renderRanks(str, kind, bare){
  const s=String(str||""); const pos=parseRanks(s);
  const ally=/\b(self|ally|allies)\b/i.test(s);
  const partySide = (kind==="hero") || ally;          // your side reads right-to-left (Rank 1 = front, on the right)
  const color = kind==="hero" ? "pos" : "tgt";        // yellow for usable position, blue for target
  if(bare){                                            // card mode: circles only (labels/chips live under the icon)
    if(pos.size===0) return "";
    const ord=partySide?[4,3,2,1]:[1,2,3,4];
    let c=""; for(const i of ord) c+=`<span class="circ ${color} ${pos.has(i)?"on":""}"></span>`;
    return `<span class="circs">${c}</span>`;
  }
  const low=s.toLowerCase();
  let chips=""; for(const [k,lab,tip] of DESC){ if(low.includes(k)) chips+=`<span class="rankchip" data-tip="${esc(tip)}" title="${esc(tip)}">${lab}</span>`; }
  let label=s.replace(/\([^)]*\)/g," ").replace(/[0-9]+\s*-\s*[0-9]+/g," ").replace(/[0-9]/g," ");
  for(const [k] of DESC) label=label.replace(new RegExp(k,"ig")," ");
  label=label.replace(/\b(enemy|enemies)\b/ig," ").replace(/[(),]/g," ").replace(/\bor\b/ig," ").replace(/\s{2,}/g," ").trim();
  const labelHtml=label?`<span class="rank-text">${esc(label)}</span>`:"";
  if (pos.size===0) return (labelHtml+chips) || `<span class="rank-text">${esc(s||"—")}</span>`;
  const order = partySide ? [4,3,2,1] : [1,2,3,4];
  let circ=""; for(const i of order) circ+=`<span class="circ ${color} ${pos.has(i)?"on":""}"></span>`;
  return `<span class="circs">${circ}</span>${labelHtml}${chips}`;
}

/* ---------- init ---------- */
function init(){
  const dlcs=["All",...new Set(state.data.heroes.map(h=>h.dlc))];
  $("dlcFilters").innerHTML=dlcs.map(d=>`<span class="chip ${d==="All"?"active":""}" data-dlc="${esc(d)}">${esc(d)}</span>`).join("");
  $("dlcFilters").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ state.dlc=c.dataset.dlc; $("dlcFilters").querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===c)); renderList(); updateFilterBtn(); });
  const tags=["All",...[...new Set(state.data.heroes.flatMap(h=>h.tags||[]))].sort()];
  $("tagFilters").innerHTML=tags.map(t=>`<span class="chip ${t==="All"?"active":""}" data-tag="${esc(t)}">${esc(t)}</span>`).join("");
  $("tagFilters").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ state.tag=c.dataset.tag; $("tagFilters").querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===c)); renderList(); updateFilterBtn(); });
  $("filterToggle").onclick=()=>$("filterPanel").classList.toggle("open");
  updateFilterBtn();
  $("search").oninput=e=>{ state.search=e.target.value.trim(); renderList(); if(state.hero) renderDetail(); };

  const lg=state.data.legend;
  $("legend").innerHTML=`<p><b>Ranks.</b> ${esc(lg.ranks)}</p>
    <div class="rank-legend">
      <span><span class="swatch" style="background:var(--accent);border-radius:50%"></span> usable position (yellow)</span>
      <span><span class="swatch" style="background:var(--tgt);border-radius:50%"></span> target (blue)</span>
      <span>filled circle = active · empty = not</span>
    </div>
    <p style="margin-top:12px"><b>Positive tokens:</b> ${lg.tokensPositive.map(esc).join(" · ")}</p>
    <p><b>Negative tokens:</b> ${lg.tokensNegative.map(esc).join(" · ")}</p>`;
  $("tips").innerHTML="<ul>"+state.data.confessionTips.map(t=>`<li>${esc(t)}</li>`).join("")+"</ul>";

  $("skillModalBg").onclick=e=>{ if(e.target===$("skillModalBg")) closeSkillModal(); };
  state.hero=state.data.heroes[0]; state.path=defaultPath(state.hero);
  renderList(); renderDetail();
  loadTeam();
  try{ state.railCollapsed = localStorage.getItem("dd2rail")==="1"; }catch(e){}
  renderBuilder();   // Team Builder is the default view
}

function filteredHeroes(){ return state.data.heroes.filter(h=>(state.dlc==="All"||h.dlc===state.dlc)&&(state.tag==="All"||(h.tags||[]).includes(state.tag))&&heroMatches(h,state.search)); }
function renderList(){
  const list=filteredHeroes();
  $("count").textContent=`${list.length} of ${state.data.heroes.length} heroes`;
  $("sidebar").innerHTML=list.map(h=>`
    <div class="hero-item ${state.hero&&h.name===state.hero.name?"active":""}" data-name="${esc(h.name)}">
      ${portraitHtml(h)}
      <div class="txt"><span class="hn">${esc(h.name)}</span><span class="hd">${esc((h.tags||[]).join(" · "))}</span>
      ${h.dlc!=="Base game"?`<span class="dlc-tag">${esc(h.dlc)}</span>`:""}</div>
    </div>`).join("");
  $("sidebar").querySelectorAll(".hero-item").forEach(el=>el.onclick=()=>{ state.hero=heroBy(el.dataset.name); state.path=defaultPath(state.hero); renderList(); renderDetail(); $("detail").scrollTop=0; });
}

function renderDetail(){
  const h=state.hero; if(!h){ $("detail").innerHTML="<p>Select a hero.</p>"; return; }
  const term=state.search, activePath=state.path||defaultPath(h);
  const ap=h.paths.find(p=>p.name===activePath)||h.paths[0]; const isDef=ap.default;

  const stats=`<div class="statgrid">
      <div class="statbox"><div class="lbl">Max HP</div><div class="val">${esc(h.stats.hp)}</div></div>
      <div class="statbox"><div class="lbl">Speed</div><div class="val">${esc(h.stats.speed)}</div></div></div>
    <div class="res-grid">${Object.entries(h.stats.resistances).map(([k,v])=>`<div class="res"><span class="rl">${esc(k)}</span><br><span class="rv">${esc(v)}</span></div>`).join("")}</div>`;
  const mech=h.mechanic?`<div class="section-title">Unique Mechanic</div><div class="mechanic">${esc(h.mechanic)}</div>`:"";
  const pathTabs=`<div class="path-tabs">${h.paths.map(p=>`<span class="path-tab ${p.name===activePath?"active":""} ${p.default?"default-path":""}" data-path="${esc(p.name)}">${esc(p.name)}${p.default?" ★":""}</span>`).join("")}</div>`;
  const pathDesc=`<div class="path-desc"><b>${esc(ap.name)}${ap.default?" (default)":""}.</b> ${esc(ap.desc)}</div>`;

  const cards=h.skills.map(s=>compSkillCardHtml(s,ap,isDef)).join("");

  $("detail").innerHTML=`
    <div class="detail-head">${portraitHtml(h,"lg")}
      <div><h2>${esc(h.name)}</h2><p class="role">${esc(h.role)}</p>
      <div class="badges"><span class="badge dlc">${esc(h.dlc)}</span>${(h.tags||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join("")}</div></div>
    </div>
    <div class="section-title">Stats</div>${stats}${mech}
    <div class="section-title">Paths <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-faint)">— click to see what each rewrites</span></div>
    ${pathTabs}${pathDesc}
    <div class="section-title">Skills <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-faint)">— <b style="color:var(--accent)">${esc(ap.name)}</b> changes shown under each modified skill</span></div>
    <div class="comp-skills">${cards}</div>
    <div class="section-title">Signature / Special Trinkets</div>
    ${h.trinkets.map(t=>`<div class="trinket"><div class="tn">${highlight(t.name,term)}</div><div class="te">${highlight(t.effect,term)}</div></div>`).join("")}`;
  $("detail").querySelectorAll(".path-tab").forEach(el=>el.onclick=()=>{ state.path=el.dataset.path; renderDetail(); });
}
function highlightPath(text,pathName){ let t=esc(text); if(pathName){ const re=new RegExp("("+pathName.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"[^.]*\\.?)","i"); t=t.replace(re,'<span class="hl">$1</span>'); } return t; }
/* compendium skill card: base + upgraded effects + all path changes (active path highlighted) */
function compSkillCardHtml(s, ap, isDef){
  const tk=typeKey(s.type);
  const path = (ap && !isDef) ? ap.name : null;
  const chips=descTagsFor(s,path);
  const head=`<div class="skic">${skillIconHtml(s)}<span class="tlabel t-${esc(tk)}">${esc(typeShort(s.type))}</span>${chips?`<div class="skic-chips">${chips}</div>`:""}</div>`;
  let eff=`<div class="skeff">${effectHtml(s.effect||"")}</div>`;
  if(s.effectUp) eff+=`<div class="skeff is-up"><span class="sub-lbl">Upgraded ⬆</span>${effectHtml(s.effectUp)}</div>`;
  const pm=(s.paths && s.paths!=="—")
    ? `<div class="skpaths"><span class="sub-lbl">Path changes</span> ${highlightPath(s.paths, path)}</div>` : "";
  return `<div class="sk comp" data-skill="${esc(s.name)}">
    ${head}
    <div class="skbody">
      <div class="skrow1"><span class="sknm">${esc(s.name)}</span></div>
      <div class="skmeta">${renderRanks(effRanks(s,path),"hero",true)}${renderRanks(effTarget(s,path),"target",true)}</div>
      ${eff}${pm}
    </div></div>`;
}

/* ================= TEAM BUILDER ================= */
let team = [null,null,null,null]; // each: {hero, path, loadout:[skillName,...]}

function saveTeam(){ try{ localStorage.setItem("dd2team", JSON.stringify(team)); }catch(e){} }
function loadTeam(){
  try{ const t=JSON.parse(localStorage.getItem("dd2team")); if(Array.isArray(t)&&t.length===4) team=t; }catch(e){}
}
$("tbClear").onclick=()=>{ team=[null,null,null,null]; saveTeam(); renderBuilder(); };
const PRESETS={
  grandslam:{team:[
    {hero:"Man-at-Arms",path:"Bulwark",loadout:["Defender","Bolster","Rampart","Crush","Stand Fast"]},
    {hero:"Crusader",path:"Templar",loadout:["Smite","Reap","Inspiring Cry","Battle Heal","Bulwark of Faith"]},
    {hero:"Highwayman",path:"Sharpshot",loadout:["Pistol Shot","Take Aim","Double Tap","Grapeshot Blast","Highway Robbery"]},
    {hero:"Plague Doctor",path:"Alchemist",loadout:["Noxious Blast","Plague Grenade","Blinding Gas","Battlefield Medicine","Ounce of Prevention"]},
  ]},
  leperGR:{team:[
    {hero:"Leper",path:"Tempest",loadout:["Chop","Ruin","Hew","Intimidate","Solemnity"]},
    {hero:"Grave Robber",path:"Nightsworn",loadout:["Thrown Dagger","Poison Dart","Flashing Daggers","Pick to the Face","Absinthe"]},
    {hero:"Jester",path:"Virtuoso",loadout:["Razor's Wit","Inspiring Tune","Battle Ballad","Play Out","Encore"]},
    {hero:"Plague Doctor",path:"Alchemist",loadout:["Battlefield Medicine","Plague Grenade","Noxious Blast","Blinding Gas","Ounce of Prevention"]},
  ]},
  leperSharp:{team:[
    {hero:"Leper",path:"Tempest",loadout:["Chop","Ruin","Hew","Intimidate","Solemnity"]},
    {hero:"Crusader",path:"Templar",loadout:["Smite","Inspiring Cry","Rallying Cry","Battle Heal","Bulwark of Faith"]},
    {hero:"Highwayman",path:"Sharpshot",loadout:["Tracking Shot","Pistol Shot","Take Aim","Double Tap","Grapeshot Blast"]},
    {hero:"Plague Doctor",path:"Alchemist",loadout:["Battlefield Medicine","Plague Grenade","Noxious Blast","Blinding Gas","Ounce of Prevention"]},
  ]},
  dot:{team:[
    {hero:"Flagellant",path:"Scourge"},
    {hero:"Crusader",path:"Templar"},
    {hero:"Runaway",path:"Arsonist"},
    {hero:"Plague Doctor",path:"Alchemist"},
  ]},
};
function loadPreset(key){
  const pr=PRESETS[key]; if(!pr) return;
  team=pr.team.map((t,i)=>({hero:t.hero, path:t.path, loadout:(t.loadout&&t.loadout.slice())||defaultLoadout(heroBy(t.hero), i+1)}));
  state.tbSelected=0; saveTeam(); renderBuilder();
}
$("tbSample").onchange=e=>{ if(e.target.value){ loadPreset(e.target.value); e.target.value=""; } };

function firstFilled(){ return team.findIndex(Boolean); }
function defaultLoadout(h, rank){   // first 5 usable-at-rank skills (then fill with the rest to reach 5)
  const usable=h.skills.filter(s=>usableAt(s,rank)).map(s=>s.name);
  const rest=h.skills.filter(s=>!usableAt(s,rank)).map(s=>s.name);
  return usable.concat(rest).slice(0,5);
}

function toggleHeroInTeam(name){
  const idx=team.findIndex(t=>t&&t.hero===name);
  if(idx>=0){                                       // already on team -> remove
    team[idx]=null;
    if(state.tbSelected===idx) state.tbSelected=firstFilled();
  } else {
    const empty=team.findIndex(t=>!t);              // front-first: scans Rank 1,2,3,4
    if(empty<0) return;                             // team full
    const h=heroBy(name);
    team[empty]={hero:name,path:defaultPath(h),loadout:defaultLoadout(h,empty+1)};
    state.tbSelected=empty;                         // view the hero we just added
  }
  saveTeam(); renderBuilder();
}
function moveSlot(i,dir){
  const j=i+dir; if(j<0||j>3) return;
  [team[i],team[j]]=[team[j],team[i]];
  if(state.tbSelected===i) state.tbSelected=j; else if(state.tbSelected===j) state.tbSelected=i;
  saveTeam(); renderBuilder();
}
function removeSlot(i){ team[i]=null; if(state.tbSelected===i) state.tbSelected=firstFilled(); saveTeam(); renderBuilder(); }
function setPath(i,path){ team[i].path=path; saveTeam(); renderBuilder(); }
function toggleUpg(i){ if(!team[i]) return; team[i].showUp=!team[i].showUp; saveTeam(); renderBuilder(); if(state.skillModal===i) renderSkillModal(); }
function toggleSkill(i,skillName){
  const t=team[i]; if(!t) return; t.loadout=t.loadout||[];
  const idx=t.loadout.indexOf(skillName);
  if(idx>=0) t.loadout.splice(idx,1);
  else { if(t.loadout.length>=5){ return; } t.loadout.push(skillName); }
  saveTeam(); renderBuilder();
  if(state.skillModal!=null) renderSkillModal();   // keep the open picker in sync
}

function renderBuilder(){ renderRail(); renderFormation(); renderTBDetail(); }

/* left icon rail (collapsible) */
function toggleRail(){ state.railCollapsed=!state.railCollapsed; try{localStorage.setItem("dd2rail",state.railCollapsed?"1":"0");}catch(e){} renderRail(); }
function renderRail(){
  const layout=document.querySelector(".tb-layout");
  if(layout) layout.classList.toggle("rail-collapsed", !!state.railCollapsed);
  const btn=$("railToggle");
  if(btn){ btn.textContent=state.railCollapsed?"▸":"◂"; btn.title=state.railCollapsed?"Show hero list":"Hide hero list"; btn.onclick=toggleRail; }
  const full=team.every(Boolean);
  const inTeam={}; team.forEach((t,i)=>{ if(t) inTeam[t.hero]=i+1; });
  $("tbRail").innerHTML=state.data.heroes.map(h=>{
    const rank=inTeam[h.name]; const dis=!rank&&full;
    const tip=`${h.name}${rank?` — Rank ${rank} (tap to remove)`:dis?" — team full":" (tap to add)"}`;
    return `<div class="rail-icon ${rank?"in-team":""} ${dis?"full-dis":""}" data-name="${esc(h.name)}" title="${esc(tip)}">
      ${portraitHtml(h,"rail")}${rank?`<span class="rail-badge">${rank}</span>`:""}</div>`;
  }).join("");
  $("tbRail").querySelectorAll(".rail-icon").forEach(el=>el.onclick=()=>toggleHeroInTeam(el.dataset.name));
}

/* formation strip (Rank 4 -> Rank 1, right-to-left) — tap to jump to that hero's block */
function renderFormation(){
  const ORDER=[3,2,1,0];
  $("tbFormation").innerHTML=ORDER.map(i=>{
    const t=team[i]; const rank=i+1;
    const rlab=`R${rank}${rank===1?" · front":rank===4?" · back":""}`;
    if(!t) return `<div class="fslot empty"><div class="frank">${rlab}</div><div style="font-size:1.3rem;opacity:.5">＋</div></div>`;
    const h=heroBy(t.hero);
    return `<div class="fslot" data-sel="${i}" title="Drag to reorder ranks">
      <div class="frank">${rlab}</div>${portraitHtml(h,"fav")}
      <div class="fname">${esc(h.name)}</div><div class="fpath">${esc(t.path)}</div></div>`;
  }).join("");
  setupFormationDrag();
}

/* drag a formation card to reorder ranks (pointer events → works on touch + mouse) */
let fdrag=null;
function reorderVisual(from,to){                 // indices into the visual (Rank4→Rank1) order
  const visual=[3,2,1,0].map(i=>team[i]);
  const [m]=visual.splice(from,1);
  visual.splice(to,0,m);
  for(let k=0;k<4;k++) team[3-k]=visual[k];       // map visual position k back to its rank slot
  saveTeam(); renderBuilder();
}
function setupFormationDrag(){
  const slots=[...$("tbFormation").querySelectorAll(".fslot")];
  slots.forEach((el,vis)=>{
    el.onpointerdown=e=>{
      if(el.classList.contains("empty")) return;
      fdrag={vis, startX:e.clientX, moved:false, slot:el.dataset.sel};
      el.setPointerCapture(e.pointerId);
    };
    el.onpointermove=e=>{
      if(!fdrag || fdrag.vis!==vis) return;
      if(!fdrag.moved && Math.abs(e.clientX-fdrag.startX)<5) return;
      fdrag.moved=true; el.classList.add("dragging");
      const rects=slots.map(s=>s.getBoundingClientRect());
      let tgt=rects.findIndex(r=>e.clientX < r.left+r.width/2); if(tgt<0) tgt=slots.length-1;
      fdrag.target=tgt;
      slots.forEach((s,k)=>s.classList.toggle("drop-target", k===tgt && k!==fdrag.vis));
    };
    const end=()=>{
      if(!fdrag || fdrag.vis!==vis) return;
      const {moved,target,slot}=fdrag;
      slots.forEach(s=>s.classList.remove("dragging","drop-target"));
      fdrag=null;
      if(moved){ if(target!=null && target!==vis) reorderVisual(vis,target); }
      else { const blk=$("tbDetail").querySelector(`[data-slot="${slot}"]`); if(blk) blk.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"}); }
    };
    el.onpointerup=end;
    el.onpointercancel=()=>{ if(fdrag){ slots.forEach(s=>s.classList.remove("dragging","drop-target")); fdrag=null; } };
  });
}

/* one skill card (shared by the main equipped list and the picker modal) */
function skillCardHtml(s, rank, equipped, ap, isDef, extraClass, showUp){
  const path = ap ? ap.name : null;
  const ok = rank==null ? true : usableAt(s,rank,path);
  const mod=!isDef && s.paths && s.paths!=="—" && new RegExp("\\b"+ap.name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i").test(s.paths);
  const modText=mod?`<div class="skpath">↳ ${esc(ap.name)}: ${tokenizeEffect(pathModExtract(s.paths,ap.name))}</div>`:"";
  const up = showUp && s.effectUp;
  const effText = up ? s.effectUp : (s.effect||"");
  const upTag = s.effectUp ? `<span class="up-tag ${up?"on":""}" title="${up?"Showing upgraded (mastered) effect":"Has an upgraded (mastered) version"}">▲</span>` : "";
  const tk=typeKey(s.type);
  const chips=descTagsFor(s,path);
  return `<div class="sk ${(rank!=null&&!ok)?"unusable":""} ${equipped?"equipped":""} ${extraClass||""}" data-skill="${esc(s.name)}">
      <div class="skic">${skillIconHtml(s)}<span class="tlabel t-${esc(tk)}">${esc(typeShort(s.type))}</span>${chips?`<div class="skic-chips">${chips}</div>`:""}</div>
      <div class="skbody">
        <div class="skrow1"><span class="sknm">${esc(s.name)}</span>${upTag}
          ${rank!=null?`<span class="use-badge ${ok?"ok":"no"}">${ok?"usable @"+rank:"not @"+rank}</span>`:""}</div>
        <div class="skmeta">${renderRanks(effRanks(s,path),"hero",true)}${renderRanks(effTarget(s,path),"target",true)}</div>
        <div class="skeff ${up?"is-up":""}">${effectHtml(effText)}</div>${modText}
      </div></div>`;
}

/* one hero block: header + equipped loadout (skill picking happens in the modal) */
function heroBlockHtml(t,i){
  const rank=i+1; const h=heroBy(t.hero);
  const ap=h.paths.find(p=>p.name===t.path)||h.paths[0]; const isDef=ap.default;
  const load=(t.loadout||[]).length;
  const head=`<div class="tbd-head">
    <div class="tbd-id" data-remove="${i}" title="Remove ${esc(h.name)} from the team">${portraitHtml(h,"md")}<div class="tbd-name">${esc(h.name)}</div></div>
    <button class="upg-toggle ${t.showUp?"on":""}" data-upg="${i}" title="Toggle base / upgraded skill effects">Upgraded ⬆</button>
    <select class="tbd-path" data-path="${i}">${h.paths.map(p=>`<option ${p.name===t.path?"selected":""}>${esc(p.name)}</option>`).join("")}</select>
  </div>`;
  const edit=`<div class="skc-edit" title="Choose skills"><span style="font-size:1.4rem">✎</span><div>${load?"Edit":"Choose"}</div><div class="skc-count ${load>=5?"full":""}">${load}/5</div></div>`;
  const cards = load===0 ? edit
    : (t.loadout).map(nm=>{ const s=h.skills.find(x=>x.name===nm); return s?skillCardHtml(s,rank,true,ap,isDef,"static",t.showUp):""; }).join("") + edit;
  return `<section class="tb-hero-block" data-slot="${i}">${head}<div class="tbd-skills">${cards}</div></section>`;
}

/* main view: every hero on the team, front (Rank 1) to back (Rank 4), stacked */
function renderTBDetail(){
  const filled=team.map((t,i)=>({t,i})).filter(x=>x.t);
  if(!filled.length){ $("tbDetail").innerHTML=`<div class="tb-empty">Tap heroes on the left to add them to your party — the front rank fills first. Drag the cards in the strip above to reorder ranks. Each hero's loadout appears here.</div>`; return; }
  $("tbDetail").innerHTML=filled.map(({t,i})=>heroBlockHtml(t,i)).join("");
  $("tbDetail").querySelectorAll("select[data-path]").forEach(el=>el.onchange=()=>setPath(+el.dataset.path, el.value));
  $("tbDetail").querySelectorAll("[data-remove]").forEach(el=>el.onclick=e=>{ e.stopPropagation(); removeSlot(+el.dataset.remove); });
  $("tbDetail").querySelectorAll("[data-upg]").forEach(el=>el.onclick=e=>{ e.stopPropagation(); toggleUpg(+el.dataset.upg); });
  $("tbDetail").querySelectorAll(".sk, .skc-edit").forEach(el=>el.onclick=()=>openSkillModal(+el.closest("[data-slot]").dataset.slot));
}

/* skill picker modal */
function openSkillModal(i){ state.skillModal=i; renderSkillModal(); $("skillModalBg").classList.add("open"); }
function closeSkillModal(){ $("skillModalBg").classList.remove("open"); state.skillModal=null; }
function renderSkillModal(){
  const i=state.skillModal; if(i==null || !team[i]){ closeSkillModal(); return; }
  const t=team[i]; const rank=i+1; const h=heroBy(t.hero);
  const ap=h.paths.find(p=>p.name===t.path)||h.paths[0]; const isDef=ap.default;
  const load=(t.loadout||[]).length;
  const rows=h.skills.slice().sort((a,b)=>usableAt(b,rank,t.path)-usableAt(a,rank,t.path)).map(s=>{
    const equipped=(t.loadout||[]).includes(s.name);
    const cap = !equipped && load>=5;
    return skillCardHtml(s, rank, equipped, ap, isDef, cap?"cap":"", t.showUp);
  }).join("");
  $("skillModal").innerHTML=`
    <div class="modal-hd">
      <div class="mh-title"><div class="mt">${esc(h.name)} — choose skills</div>
        <div class="mc loadout-count ${load>=5?"full":""}">${load}/5 equipped · usability shown for Rank ${rank} ${rank===1?"(front)":rank===4?"(back)":""}</div></div>
      <span class="modal-close" id="skillClose" title="Done">✕</span>
    </div>
    <div class="mh-controls">
      <select class="mh-path" id="modalPath" title="Hero path">${h.paths.map(p=>`<option ${p.name===t.path?"selected":""}>${esc(p.name)}</option>`).join("")}</select>
      <button class="hdr-btn warn" id="modalClear" title="Unequip all skills">Clear loadout</button>
    </div>
    <div class="modal-body">${rows}</div>`;
  $("skillClose").onclick=closeSkillModal;
  $("modalPath").onchange=e=>{ team[i].path=e.target.value; saveTeam(); renderBuilder(); renderSkillModal(); };
  $("modalClear").onclick=()=>{ team[i].loadout=[]; saveTeam(); renderBuilder(); renderSkillModal(); };
  $("skillModal").querySelectorAll(".sk").forEach(el=>el.onclick=()=>toggleSkill(i, el.dataset.skill));
}
function pathModExtract(pathsText, name){
  const re=new RegExp(name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+":?\\s*([^.]*\\.?)","i");
  const m=pathsText.match(re); return m?m[1].trim():pathsText;
}

load();
</script>
